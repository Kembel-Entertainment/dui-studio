<!-- The Studio preview skin is for authoring; configure your project's own renderer for fidelity. -->
<dui-menu width="360" height="180" background="none">
  <dui-layer id="main" height="fill">
    <dui-rect id="background" width="fill" height="fill" fill="#1B2534" />
    <dui-heading
      id="title"
      x="18"
      y="18"
      width="324"
      height="18"
      label="WELCOME TO YOUR WORLD"
      color="#D5EDA8"
    />
    <dui-text
      id="subtitle"
      x="18"
      y="45"
      width="324"
      height="18"
      label="Build something worth exploring."
      color="#ADB9CA"
    />
    <dui-button
      id="explore"
      action="explore"
      x="18"
      y="90"
      width="150"
      height="27"
      label="Explore"
    />
    <dui-button
      id="settings"
      action="settings"
      x="180"
      y="90"
      width="162"
      height="27"
      label="Settings"
    />
    <dui-text
      id="note"
      x="18"
      y="144"
      width="324"
      height="18"
      label="Your project. Your components. Your design."
      color="#8293AA"
    />
  </dui-layer>
</dui-menu>
